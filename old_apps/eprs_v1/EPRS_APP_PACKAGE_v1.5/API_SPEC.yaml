info:
  title: "EPRS Application Runtime API Specification"
  version: "1.5"
  description: "Runtime API interface specification for EPRS client applications (Web, Windows, Android, iPad, AI Tutor)."

endpoints:
  word_query:
    summary: "Query word pronunciation reasoning, IPA breakdown, rules, patterns, and memory tips"
    input:
      type: object
      properties:
        word:
          type: string
          example: "apple"
          description: "Target English word to analyze"
        mode:
          type: string
          enum: ["full", "phonetic", "learning", "rule_only"]
          default: "full"
          description: "Query depth and level of details returned"
    output:
      type: object
      properties:
        word:
          type: string
          example: "apple"
        ipa:
          type: string
          example: "/ˈæp.əl/"
        syllable:
          type: string
          example: "ap-ple"
        stress:
          type: string
          example: "Primary on 1st syllable"
        pattern_mapping:
          type: object
          properties:
            pattern_id:
              type: string
              example: "PAT-M001"
            spelling:
              type: string
              example: "a"
            phoneme:
              type: string
              example: "/æ/"
        rule_mapping:
          type: object
          properties:
            rule_id:
              type: string
              example: "R001"
            rule_name:
              type: string
              example: "Closed Syllable Short Vowel Rule"
        memory_tip:
          type: string
          example: "Short 'a' sound followed by double 'p' in closed syllable."
        practice:
          type: object
          properties:
            level:
              type: string
              example: "L1"
            distractors:
              type: array
              items:
                type: string
              example: ["/ˈeɪp.əl/", "/ˈɑːp.əl/"]

  pdf_export:
    summary: "Generate PDF study guides, flashcards, or practice worksheets"
    input:
      type: object
      properties:
        source:
          type: string
          default: "Database/English_Pronunciation_Database.yaml"
          description: "Data source file for export generation"
        filter:
          type: object
          properties:
            category:
              type: string
              example: "Animals"
              description: "Filter by MOE 1200 vocabulary topic category"
            rule:
              type: string
              example: "R001"
              description: "Filter by EPRS Rule ID (R001 - R017)"
            pattern:
              type: string
              example: "PAT-M001"
              description: "Filter by Pattern ID (PAT-M001 - PAT-M401)"
            learning_level:
              type: string
              example: "L1"
              description: "Filter by Learning Level (L1 - L5)"
        template:
          type: string
          enum: ["Templates/PDF_Template.yaml", "Templates/Worksheet_Template.yaml"]
          default: "Templates/PDF_Template.yaml"
          description: "Template layout file"
    output:
      type: string
      format: binary
      mime_type: "application/pdf"
      description: "Compiled PDF document stream"

supported_filters:
  all_words: "Exports all 1200 MOE foundational vocabulary words"
  category_filter: "Filter by lexical category (e.g., Animals, Food, Family)"
  rule_filter: "Filter by Rule Master mapping (R001 through R017)"
  pattern_filter: "Filter by Pattern Master spelling-to-sound rules (PAT-M001 through PAT-M401)"
  learning_level_filter: "Filter by Pedagogical Progression Level (L1, L2, L3, L4, L5)"
