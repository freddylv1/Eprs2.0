version: "1.7.0"

schema_name: "EPRS Offline Builder Workflow"

mode: "OFFLINE_NO_AI"

purpose: "EPRS 離線發音知識自動化建置與驗證流程"

principles:
  - "Rule First (規則優先)"
  - "Pattern Driven (型態驅動)"
  - "Exception Last (例外後置)"
  - "No AI API Dependency (零 AI 離線推論)"
  - "Strict Validation Before Commit (嚴格驗證後寫入)"

pipeline:
  - step: 1
    id: "STEP_SOURCE"
    name: "Source Processing"
    module: "Source_Processor"
    description: "載入 MOE 1200 來源單字與基礎資料 (id, word, chinese, ipa)"
    input: "Source/MOE_1200_Source_list.yaml"
    output: "Raw Word Record"

  - step: 2
    id: "STEP_SYLLABLE"
    name: "Syllable Analysis"
    module: "Syllable_Processor"
    description: "執行音節拆解、開閉音節判定與母音核心提取"
    input: "Raw Word Record"
    output: "Syllable Structures"

  - step: 3
    id: "STEP_STRESS"
    name: "Stress Detection"
    module: "Stress_Processor"
    description: "依據重音規則與詞性分析判定主/次重音位置"
    input: "Syllable Structures"
    output: "Stressed Syllables"

  - step: 4
    id: "STEP_PATTERN"
    name: "Pattern Matching"
    module: "Pattern_Processor"
    description: "對齊 Pattern Master 進行拼字發音結構組態比對"
    input: "Stressed Syllables"
    output: "Matched Patterns"

  - step: 5
    id: "STEP_RULE"
    name: "Rule Mapping"
    module: "Rule_Processor"
    description: "對映 EPRS Rule Master 發音推導通則"
    input: "Matched Patterns"
    output: "Rule Mapping Results"

  - step: 6
    id: "STEP_EXCEPTION"
    name: "Exception Check"
    module: "Exception_Processor"
    description: "檢索 Exception Master/Database 標記發音特例與不規則項"
    input: "Rule Mapping Results"
    output: "Exception Marked Record"

  - step: 7
    id: "STEP_PHONEME"
    name: "Phoneme Mapping"
    module: "Phoneme_Processor"
    description: "依據 Phoneme Master 將字母/音節轉譯為精確音素序列"
    input: "Exception Marked Record"
    output: "Phoneme Sequence"

  - step: 8
    id: "STEP_IPA"
    name: "IPA Generation"
    module: "IPA_Processor"
    description: "組裝與生成標準美式 KK / IPA 國際音標並與 Source 對比"
    input: "Phoneme Sequence"
    output: "Derived IPA"

  - step: 9
    id: "STEP_LEARNING"
    name: "Learning Module"
    module: "Learning_Processor"
    description: "生成記憶輔助 (Memory Key, Word Family, 口訣與學習提示)"
    input: "Derived IPA & Mapped Rules"
    output: "Enriched Learning Data"

  - step: 10
    id: "STEP_VALIDATION"
    name: "Data Validation"
    module: "Data_Validator"
    description: "100% 離線合規與質量等級驗證 (GOLD / SILVER / FAIL)"
    input: "Enriched Learning Data"
    output: "Validated Record & Benchmark Status"
