version: "1.0"

schema_name: EPRS Pattern Master Schema


system_role:

  name: Pattern Master

  purpose: >
    管理英文拼字模式與發音關聯，
    提供 Inference Engine 進行 Pattern Matching。


core_principles:

  - id: PM001
    name: Pattern Before Word
    description:
      優先分析拼字模式，而非逐字記憶。

  - id: PM002
    name: Context Dependent
    description:
      同一 Pattern 需依據重音、音節位置、字源判斷。

  - id: PM003
    name: Reusable Knowledge
    description:
      Pattern 可被多個單字共享。


pattern_groups:


# ==================================
# Vowel Pattern
# ==================================

  vowel_patterns:


    - id: PAT-M001

      pattern:
        a_e

      name:
        Magic e

      pronunciation:

        default:
          ipa: /eɪ/

        exception:
          examples:
            - have
            - give


      conditions:

        - stressed_syllable

        - final_e_present


      rules:

        - R003

        - R010



    - id: PAT-M002

      pattern:
        ai

      name:
        Vowel Team AI


      pronunciation:

        default:
          ipa: /eɪ/


      examples:

        - rain

        - train

        - contain


      conditions:

        - usually_stressed


      rules:

        - R004



    - id: PAT-M003

      pattern:
        air


      name:
        Air Family


      pronunciation:


        default:

          ipa:
            - /er/


        variations:

          - /ɛr/


      examples:

        - air

        - fair

        - despair


      rules:

        - R004



    - id: PAT-M004

      pattern:
        ur


      name:
        R Controlled U


      pronunciation:

        default:
          ipa: /ɜːr/


      examples:

        - turn

        - curtain


      rules:

        - R005



# ==================================
# Consonant Pattern
# ==================================


  consonant_patterns:


    - id: PAT-M101

      pattern:
        ph


      name:
        PH Digraph


      pronunciation:

        ipa:
          /f/


      examples:

        - phone

        - photo


      rules:

        - R006



    - id: PAT-M102

      pattern:
        gh


      name:
        GH Combination


      pronunciation:


        possibilities:

          silent:

            examples:

              - night


          /f/:

            examples:

              - laugh


      rules:

        - R006

        - R007

        - R010



# ==================================
# Ending Pattern
# ==================================


  ending_patterns:


    - id: PAT-M201

      pattern:
        tion


      name:
        tion Ending


      pronunciation:


        default:

          ipa:
            - /ʃən/


      examples:

        - action

        - education


      conditions:

        - unstressed_final_syllable


      rules:

        - R009

        - R008



    - id: PAT-M202

      pattern:
        tain


      name:
        TAIN Family


      pronunciation:


        stressed:

          ipa:
            - /teɪn/


          examples:

            - contain

            - maintain


        unstressed:

          ipa:
            - /tən/


          examples:

            - captain

            - curtain


      decision_logic:


        if_stressed:

          apply:
            - R004


        if_unstressed:

          apply:
            - R008



# ==================================
# Silent Letter Pattern
# ==================================


  silent_patterns:


    - id: PAT-M301

      pattern:
        gn


      name:
        Silent G


      pronunciation:


        beginning:

          examples:

            - gnome


        ending:

          examples:

            - sign


      rules:

        - R007



# ==================================
# Reduction Pattern
# ==================================


  reduction_patterns:


    - id: PAT-M401

      pattern:

        unstressed_vowel


      name:

        Schwa Reduction


      pronunciation:


        default:

          ipa:
            - /ə/


      conditions:


        - non_primary_stress


      examples:


        - about

        - balance

        - bargain


      rules:


        - R008

        - R012



# ==================================
# Pattern Decision Engine
# ==================================


decision_engine:


  input:


    - spelling

    - syllable

    - stress

    - position


  decision_order:


    1:
      check:
        stress


    2:
      check:
        vowel_pattern


    3:
      check:
        consonant_pattern


    4:
      check:
        ending_pattern


    5:
      check:
        exception



  output:


    pattern_id:

    matched_rule:

    expected_sound:

    confidence:



validation:


  pattern_confidence:

    normal_pattern:
      minimum: 90


    complex_pattern:
      minimum: 80


    exception_pattern:
      minimum: 70
