version: "1.7"
name: EPRS Phoneme Master Knowledge Base
description: Standardized English IPA phoneme classification and grapheme-to-phoneme mapping

categories:
  short_vowels:
    - symbol: "æ"
      graphemes: ["a"]
      examples: ["have", "cat", "bad"]
    - symbol: "e"
      graphemes: ["e", "ea", "ai", "ay"]
      examples: ["bed", "said", "says"]
    - symbol: "ɪ"
      graphemes: ["i", "ui", "y"]
      examples: ["give", "live", "pin", "city"]
    - symbol: "ɒ"
      graphemes: ["o"]
      examples: ["pot", "dog"]
    - symbol: "ʌ"
      graphemes: ["u", "o", "oe"]
      examples: ["cup", "come", "some", "done", "one"]

  long_vowels:
    - symbol: "eɪ"
      graphemes: ["a_e", "ai", "ay"]
      examples: ["make", "rain", "day"]
    - symbol: "iː"
      graphemes: ["e_e", "ee", "ea", "ie"]
      examples: ["believe", "see", "tea"]
    - symbol: "aɪ"
      graphemes: ["i_e", "igh", "y", "i"]
      examples: ["alliance", "appliance", "defiance", "like", "high"]
    - symbol: "oʊ"
      graphemes: ["o_e", "oa", "ow", "o"]
      examples: ["associate", "home", "boat", "go"]
    - symbol: "uː"
      graphemes: ["o", "oo", "u_e", "ew"]
      examples: ["do", "to", "who", "two", "food", "blue"]

  r_controlled_vowels:
    - symbol: "ɑːr"
      graphemes: ["ar", "are"]
      examples: ["car", "are"]
    - symbol: "ɜːr"
      graphemes: ["er", "ir", "ur", "ere"]
      examples: ["were", "her", "bird", "turn"]
    - symbol: "ɔːr"
      graphemes: ["or", "ore", "our"]
      examples: ["for", "more", "four"]

  reduced_vowels:
    - symbol: "ə"
      name: "Schwa"
      graphemes: ["a", "e", "i", "o", "u"]
      condition: "Unstressed syllable reduction"
      examples: ["advance", "collapse", "assistance", "attendance"]
    - symbol: "əns"
      name: "ANCE Special Reduction"
      graphemes: ["ance", "ence"]
      examples: ["balance", "distance", "elegance", "ambulance"]

  consonants_and_digraphs:
    - symbol: "dʒ"
      graphemes: ["dge", "j", "g"]
      examples: ["bridge", "judge", "edge"]
    - symbol: "ʃ"
      graphemes: ["sh", "ci", "ti", "si"]
      examples: ["associate", "appreciate", "ship", "nation"]
    - symbol: "v"
      graphemes: ["v", "ve"]
      examples: ["have", "give", "live", "advance", "convince"]
    - symbol: "s"
      graphemes: ["s", "c", "ss", "ce"]
      examples: ["distance", "balance", "convince", "compliance"]
