version: "1.0.0"
layer_name: "EPRS Exception Word Database"
description: "收錄不符合通則推導 (Rule Exception) 與歷史特殊發音單字之結構化資料庫"

classification_policy:
  source: "Offline Exception Resolver & Rule Engine Audit"
  action: "Mark as Exception & Assign Exception ID"

exceptions:
  - id: EX-001
    word: "have"
    syllable: ["have"]
    expected_rule: "R001 (Magic e -> /eɪ/)"
    actual_ipa: "/hæv/"
    exception_type: "Vowel Length Anomaly"
    resolution: "Classified as Primary Exception EX-001"

  - id: EX-002
    word: "said"
    syllable: ["said"]
    expected_rule: "R004 (Vowel Team ai -> /eɪ/)"
    actual_ipa: "/sɛd/"
    exception_type: "Vowel Team Monophthongization"
    resolution: "Classified as Primary Exception EX-002"

  - id: EX-003
    word: "one"
    syllable: ["one"]
    expected_rule: "R001 (Magic e -> /oʊ/)"
    actual_ipa: "/wʌn/"
    exception_type: "Onset Gliding Anomaly"
    resolution: "Classified as Primary Exception EX-003"
