version: "1.7.0"
config_name: "EPRS Offline Builder Configuration"

offline_mode:
  enabled: true
  allow_ai_api: false
  fallback_to_rules: true

batch_processing:
  batch_size: 100
  total_expected_batches: 12
  total_words: 1200
  auto_continue_on_error: false

sources:
  word_list: "Source/MOE_1200_Source_list.yaml"
  pdf_reference: "Source/MOE_1200_Source.pdf"

masters:
  rule_master: "Knowledge/EPRS_Rule_Master.yaml"
  pattern_master: "Knowledge/Pattern_Master.yaml"
  stress_master: "Knowledge/Stress_Master.yaml"
  exception_master: "Knowledge/Exception_Master.yaml"
  phoneme_master: "Knowledge/Phoneme_Master.yaml"

validation_rules:
  strict_sequential_id: true
  zero_forbidden_fields_in_source: true
  required_quality_level: "GOLD"
  ipa_match_threshold: 1.0

outputs:
  status_file: "Builder/Builder_Status.yaml"
  report_file: "Builder/Builder_Report.yaml"
