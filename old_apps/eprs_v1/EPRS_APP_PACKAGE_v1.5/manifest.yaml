package_name: "EPRS APP Runtime Package"
version: "1.5"
build_date: "2026-08-05"

loader_sequence:
  - "Core/EPRS_Rule_Master.yaml"
  - "Knowledge/Pattern_Master.yaml"
  - "Knowledge/Stress_Master.yaml"
  - "Knowledge/Exception_Master.yaml"
  - "Database/English_Pronunciation_Database.yaml"
  - "Core/EPRS_Learning_Model.yaml"
  - "Templates/PDF_Template.yaml"
  - "Templates/Worksheet_Template.yaml"

required_files:
  - "Core/EPRS_Rule_Master.yaml"
  - "Knowledge/Pattern_Master.yaml"
  - "Knowledge/Stress_Master.yaml"
  - "Knowledge/Exception_Master.yaml"
  - "Database/English_Pronunciation_Database.yaml"
  - "Core/EPRS_Learning_Model.yaml"

optional_files:
  - "Templates/PDF_Template.yaml"
  - "Templates/Worksheet_Template.yaml"

dependency_map:
  Core/EPRS_Rule_Master.yaml:
    depends_on: []
    description: "Core pronunciation rule engine defining R001 through R017 rules"
  Knowledge/Pattern_Master.yaml:
    depends_on:
      - "Core/EPRS_Rule_Master.yaml"
    description: "Phonics pattern definitions PAT-M001 through PAT-M401"
  Knowledge/Stress_Master.yaml:
    depends_on:
      - "Core/EPRS_Rule_Master.yaml"
    description: "Syllable stress and accent placement rules"
  Knowledge/Exception_Master.yaml:
    depends_on:
      - "Core/EPRS_Rule_Master.yaml"
      - "Knowledge/Pattern_Master.yaml"
    description: "Phonetic exception overrides and irregular spellings"
  Database/English_Pronunciation_Database.yaml:
    depends_on:
      - "Core/EPRS_Rule_Master.yaml"
      - "Knowledge/Pattern_Master.yaml"
      - "Knowledge/Stress_Master.yaml"
      - "Knowledge/Exception_Master.yaml"
    description: "Official 1200 MOE vocabulary database with IPA, breakdown, and rule/pattern tags"
  Core/EPRS_Learning_Model.yaml:
    depends_on:
      - "Database/English_Pronunciation_Database.yaml"
    description: "Pedagogical progression, SRS retention curve, and difficulty levels (L1-L5)"
  Templates/PDF_Template.yaml:
    depends_on:
      - "Database/English_Pronunciation_Database.yaml"
    description: "Layout specification for PDF flashcard and review worksheet exports"
  Templates/Worksheet_Template.yaml:
    depends_on:
      - "Database/English_Pronunciation_Database.yaml"
    description: "Layout specification for student test sheets and practice workbooks"

