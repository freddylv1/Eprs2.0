version: "1.7"
name: EPRS Word Family Master Knowledge Base
description: Categorizes vocabulary into phonetic, morphological, and stress word families

word_families:
  ANCE_ENDING_FAMILY:
    id: "WF-M402"
    name: "ANCE Ending Family"
    pattern_id: "PAT-M402"
    rule_id: "R018"
    phoneme_tail: "əns"
    words:
      - word: "advance"
        pos: "v."
        stress_index: 1
      - word: "balance"
        pos: "n."
        stress_index: 0
      - word: "alliance"
        pos: "n."
        stress_index: 1
      - word: "defiance"
        pos: "n."
        stress_index: 1
      - word: "distance"
        pos: "n."
        stress_index: 0
      - word: "elegance"
        pos: "n."
        stress_index: 0
      - word: "ambulance"
        pos: "n."
        stress_index: 0
      - word: "appliance"
        pos: "n."
        stress_index: 1
      - word: "assistance"
        pos: "n."
        stress_index: 1
      - word: "attendance"
        pos: "n."
        stress_index: 1
      - word: "compliance"
        pos: "n."
        stress_index: 1

  PALATAL_FAMILY:
    id: "WF-PAT11"
    name: "Palatalization Combination Family"
    pattern_id: "PAT-11"
    rule_id: "R006"
    phoneme_tail: "ʃi.eɪt"
    words:
      - word: "associate"
        pos: "v."
        stress_index: 1
      - word: "appreciate"
        pos: "v."
        stress_index: 1

  HISTORICAL_EXCEPTION_FAMILY:
    id: "WF-EXC-HIST"
    name: "Historical Exception Family"
    pattern_id: "PAT-01"
    rule_id: "R010"
    words:
      - word: "have"
        pos: "v."
        ipa: "/hæv/"
      - word: "give"
        pos: "v."
        ipa: "/ɡɪv/"
      - word: "live"
        pos: "v."
        ipa: "/lɪv/"

  PREFIX_REDUCTION_FAMILY:
    id: "WF-PAT12"
    name: "Prefix Reduction Family"
    pattern_id: "PAT-12"
    rule_id: "R017"
    words:
      - word: "collapse"
        pos: "v."
        stress_index: 1
      - word: "believe"
        pos: "v."
        stress_index: 1
      - word: "convince"
        pos: "v."
        stress_index: 1

  SILENT_CONSONANT_FAMILY:
    id: "WF-PAT07"
    name: "Silent Consonant Family"
    pattern_id: "PAT-03"
    rule_id: "R001"
    words:
      - word: "bridge"
        pos: "n."
        ipa: "/brɪdʒ/"
