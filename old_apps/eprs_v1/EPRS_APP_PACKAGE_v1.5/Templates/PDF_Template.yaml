version: "1.0"

schema_name: EPRS App PDF Template Specification

description: >
  定義 EPRS Learning App MVP 之三種 PDF 匯出模板結構與視覺排版規格。

templates:

  - id: detailed_textbook
    name: 詳細教材版 (Detailed Textbook)
    target_audience: 自學者、初學者與教學講師
    layout:
      page_size: A4
      orientation: portrait
      margins: { top: 15mm, bottom: 15mm, left: 15mm, right: 15mm }
      items_per_page: 6
    sections:
      header:
        title: "EPRS 英文發音推理詳細教材"
        branding: "EPRS English Pronunciation Reasoning System"
        show_date: true
        show_page_number: true
      item_card_layout:
        border: "1px solid #E2E8F0"
        border_radius: "8px"
        padding: "12px"
        fields:
          - field: word
            style: { font_size: "20pt", font_weight: "bold", color: "#1E293B" }
          - field: syllables
            style: { font_size: "12pt", color: "#3B82F6", label: "音節切分: " }
          - field: ipa
            style: { font_size: "14pt", font_weight: "medium", color: "#0D9488", label: "標準音標: " }
          - field: patterns
            style: { font_size: "10pt", color: "#8B5CF6", label: "拼字模式: " }
          - field: applied_rules
            style: { font_size: "10pt", color: "#D97706", label: "套用規則: " }
          - field: reasoning_chain
            style: { font_size: "9pt", color: "#475569", background: "#F8FAFC", padding: "6px" }
          - field: learning_hint
            style: { font_size: "9pt", italic: true, color: "#166534", label: "記憶訣竅: " }

  - id: quick_review
    name: 快速複習版 (Quick Review)
    target_audience: 考前快速記憶、熟練者總複習
    layout:
      page_size: A4
      orientation: portrait
      margins: { top: 10mm, bottom: 10mm, left: 10mm, right: 10mm }
      table_layout: true
      rows_per_page: 25
    sections:
      header:
        title: "EPRS 英文發音推理 快速複習單"
        show_page_number: true
      table_columns:
        - name: "No."
          width: "8%"
          align: "center"
        - name: "Word (單字)"
          width: "20%"
          font_weight: "bold"
        - name: "Syllables (音節)"
          width: "18%"
          color: "#2563EB"
        - name: "IPA (音標)"
          width: "20%"
          color: "#059669"
        - name: "Pattern & Rule (模式與規則)"
          width: "22%"
          color: "#D97706"
        - name: "Mnemonic (速記提示)"
          width: "12%"
          font_size: "8pt"

  - id: quiz
    name: 測驗版 (Quiz Worksheet)
    target_audience: 課堂測驗、自主評量與自我檢測
    layout:
      page_size: A4
      orientation: portrait
      margins: { top: 12mm, bottom: 12mm, left: 12mm, right: 12mm }
      items_per_page: 10
    sections:
      header:
        title: "EPRS 發音推理能力測驗卷"
        subtitle: "請根據拼字模式與發音規則，填寫音節切分、標註重音與推導音標。"
        fields:
          - "姓名: ___________"
          - "日期: ___________"
          - "得分: ___________"
      item_quiz_layout:
        border_bottom: "1px dashed #CBD5E1"
        padding: "10px 0"
        fields:
          - field: word
            style: { font_size: "16pt", font_weight: "bold" }
          - field: blank_syllables
            prompt: "1. 音節切分: ____________________"
          - field: blank_stress
            prompt: "2. 重音位置 (第幾音節): ____"
          - field: blank_ipa
            prompt: "3. 推導音標: [ / ____________ / ]"
          - field: blank_rule
            prompt: "4. 主要規則編號: [ R______ ]"
      answer_key_appendix:
        enabled: true
        position: end_of_document
        title: "解答與推導說明 (Answer Key & Explanations)"
        format: compact_table
