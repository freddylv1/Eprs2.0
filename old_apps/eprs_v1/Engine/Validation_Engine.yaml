version: "1.7"
name: EPRS Validation Engine
description: Multi-point structural and semantic validation for word records across all 9 inference stages

pipeline_stage: 9

validation_chain:
  stage_1_word:
    check: "Word must be non-empty string"
  stage_2_syllable:
    check: "Syllable array length >= 1"
  stage_3_stress:
    check: "Primary stress index must be valid integer within syllable array bounds"
  stage_4_pattern:
    check: "Pattern ID must follow valid EPRS pattern format (e.g. PAT-01..PAT-M402)"
  stage_5_rule:
    check: "Rule ID must follow valid EPRS rule format (e.g. R001..R018)"
  stage_6_exception:
    check: "If exception, exception_id must match taxonomy (HIST-*, ORTH-*, REDUC-*)"
  stage_7_phoneme:
    check: "Phonemes must be mapped for each syllable"
  stage_8_ipa:
    check: "IPA must start with / and end with / and contain valid phoneme symbols"
  stage_9_validation:
    check: "Memory tip must contain non-empty type, content, and related_words array"

output_spec:
  is_valid: boolean
  validation_level: "GOLD" | "SILVER" | "FAILED"
  passed_checks: array
  failed_checks: array
