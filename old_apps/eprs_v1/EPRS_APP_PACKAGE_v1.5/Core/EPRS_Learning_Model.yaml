version: "1.0"

schema_name: EPRS Learning Model Schema

system_role:
  name: EPRS Human Learning Engine
  purpose:
    - 將發音規則轉換為學習策略
    - 建立可推演的英文發音能力
    - 降低單字死背需求

core_principles:

  L001:
    name: Pattern Before Word
    description:
      >
      學習優先記憶發音模式，而非單獨記憶單字。

  L002:
    name: Stress First
    description:
      >
      先判斷重音，再判斷母音完整或弱化。

  L003:
    name: Sound Family Memory
    description:
      >
      相同 Pattern 與 Sound 的單字建立群組。

  L004:
    name: Exception Controlled
    description:
      >
      例外單字獨立標記，但不可破壞通則。

  L005:
    name: Predictive Learning
    description:
      >
      學習者看到新單字時，可以依規則推測發音。


learning_flow:

  step_1:
    name: Word Structure Recognition
    actions:
      - 找 Prefix
      - 找 Root
      - 找 Suffix
      - 分割音節

  step_2:
    name: Stress Recognition
    actions:
      - 判斷主要重音
      - 判斷非重讀音節

  step_3:
    name: Pattern Matching
    actions:
      - 比對 Pattern Master
      - 找 Sound Family

  step_4:
    name: Rule Application
    actions:
      - 套用 Rule Master
      - 推導 IPA

  step_5:
    name: Memory Encoding
    actions:
      - 建立記憶規則
      - 建立相似字群


learning_output_schema:

  memory_rule:
    description:
      >
      用一句簡單規則描述此字發音。

    example:
      word: bargain
      rule:
        >
        ar 在重讀音節通常發 /ɑːr/，
        非重讀 -gain 弱化為 /gən/

  pattern_family:

  sound_family:

  similar_words:

  prediction_rule:
    description:
      >
      提供遇到類似結構時的推演方法。


teaching_level:

  STAGE-01:
    name: 基礎母音
    target:
      - 短母音
      - 閉音節

  STAGE-02:
    name: 長母音
    target:
      - Open Syllable
      - Magic e

  STAGE-03:
    name: 複合音型
    target:
      - Vowel Team
      - Digraph

  STAGE-04:
    name: 多音節推理
    target:
      - Stress
      - Schwa
      - Suffix

  STAGE-05:
    name: 高階例外
    target:
      - Exception
      - Historical Pattern


教材生成規則:

  every_word_must_include:

    - word
    - chinese
    - ipa
    - syllable_analysis
    - stress_analysis
    - pattern_explanation
    - rule_explanation
    - memory_rule
    - prediction_rule
    - similar_words


quality_check:

  must_verify:

    - 是否能解釋 IPA
    - 是否符合 Rule Master
    - 是否能類推其他單字
    - 是否降低死背需求
    - 是否適合國中小學習


final_goal:

  description:
    >
    建立一套人類可以透過規則快速推演英文發音，
    並透過 Pattern Family 建立長期記憶的學習系統。
