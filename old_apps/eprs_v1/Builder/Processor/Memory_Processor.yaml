version: "1.6.1"

name:
  Memory Generation Processor

input:
  word:
    required: true
  pattern:
    required: true
  exception_check:
    required: true
  ipa:
    required: true

process:
  - extract_pattern_mnemonic
  - format_exception_tip
  - build_memory_association

output:
  memory_tip:
    format:
      type: string
      content: string
      related_words: array
